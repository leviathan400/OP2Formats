[package]
name = "op2-formats"
version = "0.4.0"
edition.workspace = true
license.workspace = true
description = "Outpost 2 file formats library - Read and Write Outpost 2's data files: .vol archives, maps, tilesets, sheets etc"
repository = "https://github.com/leviathan400/OP2Formats"
rust-version = "1.99"
keywords = ["outpost2", "gamedev", "file-format", "parser"]
categories = ["parser-implementations", "game-development"]
# Only the crate: the C interface, the other crates, the format documents and CMake stay in the repository.
include = ["/src/**", "/tests/**", "/examples/**", "/LICENSE", "/README.md", "/CHANGELOG.md"]

[features]
# Extracting GOG's offline installer (Inno Setup); the shipped programs that offer it turn it on.
inno = ["dep:lzma-rust2", "dep:flate2", "dep:crc32fast"]
# Installing the OPU community update from its official installer (an NSIS installer).
opu = ["dep:lzma-rust2", "dep:flate2", "dep:crc32fast"]
# Downloading OPU's installer from outpost2.net (`--fetch-opu`), with the HTTPS client op2-report already uses.
fetch-opu = ["opu", "dep:ureq"]
# OP2MissionEditor's .opm missions (`opm`).
opm = ["dep:serde", "dep:serde_json"]
# OP2MapJsonTools' JSON maps (`mapjson`).
mapjson = ["dep:serde", "dep:serde_json"]

[dependencies]
thiserror = "2"
dirs = "7"
sha1_smol = "1"
# Decoding the few functions of Outpost2.exe whose stores hold tables (`exe::code`).
iced-x86.workspace = true
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "optimization"], optional = true }
flate2 = { version = "1", optional = true }
crc32fast = { version = "1", optional = true }
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
# Builds the LZMA stream of a synthetic NSIS installer in the nsis tests.
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "encoder"] }

[[test]]
name = "opm"
required-features = ["opm"]

[[test]]
name = "mapjson"
required-features = ["mapjson"]

[[example]]
name = "opm_rewrite"
required-features = ["opm"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

[workspace]
resolver = "3"
members = ["op2formats-c"]

# Inherited by the crate above (`edition.workspace`, `license.workspace`), as in op2-rs's workspace.
[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

# Inherited by the crate above (`iced-x86.workspace = true`), as op2-rs's tools workspace declares it.
[workspace.dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
