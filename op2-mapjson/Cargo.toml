[package]
name = "op2-mapjson"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Converts Outpost 2 .map files to and from OP2MapJsonTools' JSON (PerRowPadded)"

[dependencies]
op2-formats = { path = "../op2-formats" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
