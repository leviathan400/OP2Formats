# Regenerate include/op2formats.h after changing the interface (from this folder):
#   cbindgen --config cbindgen.toml --output include/op2formats.h
language = "C"
include_guard = "OP2FORMATS_H"
cpp_compat = true
documentation_style = "c99"
usize_is_size_t = true
header = """/* op2formats.h: C interface to OP2Formats, the Outpost 2 file formats library.
 * Generated by cbindgen from op2formats-c/src/lib.rs (see cbindgen.toml); do not edit by hand.
 * SPDX-License-Identifier: GPL-3.0-or-later
 *
 * Conventions:
 * - Objects are opaque handles made by an op2f_*_open or op2f_*_parse function and released with the
 *   matching op2f_*_free. Freeing NULL does nothing. A handle may be read from several threads at once.
 * - Functions that can fail return an Op2fStatus. After a failure, op2f_last_error gives the calling
 *   thread's message. Plain getters return their value directly (0 for a NULL handle).
 * - Strings passed in are NUL-terminated UTF-8. Strings passed out are UTF-8, copied into a caller buffer
 *   (buf, cap) and NUL-terminated; *len (when len isn't NULL) receives the full length without the NUL.
 *   A NULL buf with cap 0 asks only for the length. A buffer too small receives a truncated copy and the
 *   call returns OP2F_STATUS_BUFFER_TOO_SMALL.
 * - Map coordinates are the file's; op2f_map_x_padding converts to the game's.
 * - No Rust panic crosses into the caller: one becomes OP2F_STATUS_PANIC.
 * - No game data is built in: everything is read from the player's own Outpost 2 install. */"""

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[export]
include = ["Op2fCellType"]
